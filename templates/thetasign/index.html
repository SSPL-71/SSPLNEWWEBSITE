<script>
document.addEventListener("DOMContentLoaded", () => {

    // Door animation
    setTimeout(() => {
        document.querySelector(".left-door").style.transform = "rotateY(-90deg)";
        document.querySelector(".right-door").style.transform = "rotateY(90deg)";
        document.querySelector(".brand").style.opacity = 1;
    }, 400);

    // Video toggle
    const btn = document.getElementById("toggleVideoBtn");
    const container = document.getElementById("introVideoContainer");

    if (btn && container) {
        btn.addEventListener("click", () => {

            if (container.style.display === "none" || container.style.display === "") {
                container.style.display = "block";
                btn.innerHTML = "▼ Hide Quick Start Video";
            } else {
                container.style.display = "none";
                btn.innerHTML = "▶ ThetaSign - Watch the 90 Sec Video";
            }

        });
    }

});
